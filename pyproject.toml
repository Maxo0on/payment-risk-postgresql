[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-risk-lab"
version = "1.1.0"
description = "Payment risk and hourly forecasting with PostgreSQL feature marts"
requires-python = ">=3.11,<3.15"
dependencies = [
    "catboost>=1.2.8,<2",
    "lightgbm>=4.6,<5",
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=17,<27",
    "scikit-learn>=1.5,<2",
    "statsmodels>=0.14.4,<0.16",
    "threadpoolctl>=3.5,<4",
]

[project.scripts]
payment-risk = "payment_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
payment_risk = ["sql/*.sql"]
