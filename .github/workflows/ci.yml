name: PostgreSQL checks

# Проверка запускается при отправке коммитов и изменениях в pull request.
on: [push, pull_request]

# Служебному токену достаточно прав чтения исходников.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # GitHub запускает PostgreSQL на время проверки. Имя базы и учётные
    # данные совпадают с локальным демонстрационным окружением.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: payments
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments_dev
        ports:
          - '5432:5432'
        # Шаги начнутся после того, как проверка готовности базы пройдёт.
        options: >-
          --health-cmd "pg_isready -U payments -d payments"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # CLI и тест витрин используют эту строку для подключения к сервису.
      PAYMENT_RISK_PG_DSN: postgresql://payments:payments_dev@127.0.0.1:5432/payments
    steps:
      - uses: actions/checkout@v6
        with:
          # Токен нужен только для получения исходников на этом шаге.
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project
        # Устанавливаем зависимости и подключаем исходники из полученной копии.
        run: python -m pip install -e .
      - name: Run tests
        # unittest находит файлы test_*.py в каталоге tests.
        run: python -m unittest discover -s tests -v
      - name: Run demo
        # 42 дня достаточно для короткой проверки всех стадий проекта.
        run: python -m payment_risk --days 42 --out results_ci
      - name: Record Python environment
        run: |
          python -VV > results_ci/environment.txt
          python -m pip list --format=freeze >> results_ci/environment.txt
      - name: Check demo outputs
        # test -s проверяет, что каждый ожидаемый файл существует и заполнен.
        run: |
          for artifact in report.html hourly_mart.parquet transaction_mart.parquet \
                          risk_metrics.csv policy_metrics.csv forecast_next_24h.csv \
                          anomaly_hours.csv test_scored.csv risk_summary.json forecast_summary.json \
                          models/catboost.cbm models/lightgbm.txt models/feature_schema.json; do
            test -s "results_ci/$artifact"
          done
      - name: Verify saved models, decisions and forecasts
        run: python scripts/verify_artifacts.py results_ci
      - name: Upload complete demo results
        uses: actions/upload-artifact@v4
        with:
          # Сохраняем результаты этого синтетического прогона вместе с его моделями.
          name: payment-risk-demo
          path: results_ci/
          if-no-files-found: error
